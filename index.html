<style id="theme-enhancements">
:root{--surface:#fff;--text:#35251e;--muted:#75675f;--accent:#603525;--accent2:#e8a04b}
body{background:var(--bg);color:var(--text);transition:background .35s ease,color .35s ease}
body[data-theme="dark"]{--bg:#171412;--surface:#24201d;--line:#3d3530;--text:#f7eee8;--muted:#b9aaa0;--b:#a96745;--accent:#a96745;--accent2:#f0ad5c}
body[data-theme="rose"]{--bg:#fff1f5;--surface:#fffafb;--line:#f4c8d5;--text:#542a38;--muted:#936878;--b:#be5678;--accent:#be5678;--accent2:#ed8fab}body[data-theme="ocean"]{--bg:#eef8f8;--surface:#fff;--line:#cfe4e4;--text:#173b3d;--muted:#5e7778;--b:#176b70;--accent:#176b70;--accent2:#4bb4b0}
.card,.panel,dialog,.actions{background:var(--surface)!important;color:var(--text);transition:background .35s ease,color .35s ease,border-color .35s ease,transform .2s ease}.card:hover{transform:translateY(-2px)}button,.choice{transition:transform .16s ease,background .25s ease,color .25s ease,border-color .25s ease}button:active,.choice:active{transform:scale(.96)}.day{transition:background .2s ease,transform .15s ease}.day:active{transform:scale(.95)}.theme-switch{display:flex;gap:5px;padding:4px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.theme-switch button{padding:7px 9px;background:transparent;color:var(--text)}.theme-switch button.active{background:var(--b);color:#fff}.top-tools{display:flex;align-items:center;gap:8px}.pop{animation:pop .28s ease}.modal{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}@keyframes pop{0%{transform:scale(.94);opacity:.5}100%{transform:scale(1);opacity:1}}@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}@media(max-width:700px){.top-tools{display:block}.theme-switch{margin-top:8px;justify-content:center}.theme-switch button{flex:1}}
</style></head><body><div class='wrap'><div class='top'><div><h1 style='margin-bottom:2px'>📅 ตารางเวรของฉัน</h1><div>เพิ่ม แก้ไข คำนวณค่าเวร และติดตามเวรที่ทำแล้ว</div></div><div class='top-tools'><div class='theme-switch'><button data-theme-btn='light' onclick="setTheme('light')">☀️</button><button data-theme-btn='dark' onclick="setTheme('dark')">🌙</button><button data-theme-btn='ocean' onclick="setTheme('ocean')">🌊</button><button data-theme-btn='rose' onclick="setTheme('rose')">🌹</button></div><div class='nav'><button onclick='changeMonth(-1)'>‹</button> <button onclick='goToday()'>วันนี้</button> <button onclick='changeMonth(1)'>›</button></div></div></div><div class='stats' style='margin-top:16px'><div class='card'>เวรเดือนนี้<div class='big' id='count'>0 รายการ</div></div><div class='card'>รวมค่าเวร<div class='big' id='sum'>฿0</div></div><div class='card'>ได้รับแล้ว<div class='big' id='paid'>฿0</div></div><div class='card'>ความคืบหน้า<div class='big' id='progress'>0%</div></div></div><div class='panel cal'><div class='calhead'><h2 id='monthTitle'></h2><span>🟠 วันนี้ · 🔔 มีเวร · ✅ อยู่เวรแล้ว</span></div><div class='week'><div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div></div><div class='grid' id='grid'></div></div></div>
<dialog id='dlg'><div class='modal'><div style='display:flex;justify-content:space-between'><div><h2 style='margin:0'>บันทึกตารางเวร</h2><div id='dateLabel'></div></div><button onclick='dlg.close()'>✕</button></div><div class='field'><label>เลือกช่วงเวลาเวร</label><div class='choices' id='shiftChoices'></div></div><div class='field'><label>ประเภทค่าเวร</label><div class='choices'><button class='choice on' id='clinicBtn' onclick="setType('clinic')">🏥 คลินิก (90฿/ชม.)</button><button class='choice' id='hospitalBtn' onclick="setType('hospital')">🏨 รพ. (55฿/ชม.)</button></div></div><div class='field'><label>หัวข้อเวร / สถานที่</label><div class='choices' id='deptChoices'></div></div><div class='row'><div class='field'><label>เวลาเริ่ม</label><input type='time' id='start'></div><div class='field'><label>เวลาสิ้นสุด</label><input type='time' id='end'></div></div><div class='money'>💰 ค่าเวรคำนวณ: <span id='calc'>฿0</span></div><div class='field'><label>หมายเหตุ</label><textarea id='note' placeholder='เช่น สลับเวร, รับเคสพิเศษ'></textarea></div><label><input style='width:auto' type='checkbox' id='done'> อยู่เวรเรียบร้อยแล้ว / ได้รับค่าเวรแล้ว</label><div class='actions'><button class='danger' onclick='removeShift()'>ลบเวร</button><button onclick='dlg.close()'>ยกเลิก</button><button class='primary' onclick='saveShift()'>💾 บันทึก</button></div></div></dialog>
<script>
const shifts=[['เวรกลางวัน','08:30','16:30'],['รอบ 1','16:30','21:30'],['รอบ 2','21:30','02:30'],['รอบ 3','02:30','08:30']],clinic=['SPC','ENT','SM','PED','OP7','MS สั้น','MS ยาว','NM2 สั้น1','NM.2 สั้น2','NM.2 ยาว','103','SKN'],hospital=['103 1','103 2','103 3','IPD 1','IPD 2','IPD 3','IPD 4','IPD 5','NM.5 1','NM.5 2','NM.5 3'];let view=new Date(),selected='',editingId=null,type='clinic',dept='',shiftName='',data=JSON.parse(localStorage.getItem('shift-data')||'{}');Object.keys(data).forEach(k=>{if(!Array.isArray(data[k]))data[k]=data[k]?[{...data[k],id:data[k].id||Date.now()+Math.random()}]:[]});localStorage.setItem('shift-data',JSON.stringify(data));const dlg=document.getElementById('dlg'),start=document.getElementById('start'),end=document.getElementById('end');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),money=n=>'฿'+Math.round(n).toLocaleString('th-TH');function hours(s,e){let[a,b]=s.split(':').map(Number),[c,d]=e.split(':').map(Number),x=c+d/60-a-b/60;return x<=0?x+24:x}const cost=()=>hours(start.value,end.value)*(type==='clinic'?90:55);
function render(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];monthTitle.textContent=months[m]+' '+(y+543);grid.innerHTML='';for(let i=0;i<first.getDay();i++)grid.insertAdjacentHTML('beforeend',"<div class='day'></div>");for(let d=1;d<=last.getDate();d++){let dt=new Date(y,m,d),k=key(dt),arr=data[k]||[],x=document.createElement('div');x.className='day'+(k===key(new Date())?' today':'');let labels=arr.slice(0,2).map(v=>'<span class="badge '+(v.done?'done':'')+'">'+(v.done?'✅ ':'🔔 ')+v.shift+' · '+v.dept+'</span>').join('<br>');if(arr.length>2)labels+='<br><span class="badge">+'+(arr.length-2)+' เวร</span>';x.innerHTML='<b>'+d+'</b>'+(arr.length?'<span class="dot"></span><br>'+labels:'');x.onclick=()=>openDay(k);grid.append(x)}stats()}
function stats(){let pre=view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0'),a=Object.entries(data).filter(x=>x[0].startsWith(pre)).flatMap(x=>x[1]),s=a.reduce((x,v)=>x+(v.cost||0),0),p=a.filter(v=>v.done).reduce((x,v)=>x+(v.cost||0),0);count.textContent=a.length+' รายการ';sum.textContent=money(s);paid.textContent=money(p);progress.textContent=(s?Math.round(p/s*100):0)+'%'}
function setType(t){type=t;clinicBtn.classList.toggle('on',t==='clinic');hospitalBtn.classList.toggle('on',t==='hospital');renderDept();updateCalc()}function renderDept(){deptChoices.innerHTML=(type==='clinic'?clinic:hospital).map(x=>'<button class="choice '+(x===dept?'on':'')+'" onclick="dept=this.textContent;renderDept()">'+x+'</button>').join('')}
function openDay(k,id=null){selected=k;editingId=id;let arr=data[k]||[],v=id!=null?arr.find(x=>String(x.id)===String(id)):null;dateLabel.innerHTML=new Date(k+'T12:00').toLocaleDateString('th-TH',{dateStyle:'full'})+(arr.length?'<div style="margin-top:8px;font-size:13px">มี '+arr.length+' เวร: '+arr.map(x=>'<button type="button" onclick="openDay(\''+k+'\',\''+x.id+'\')" style="margin:2px;padding:5px 8px">'+x.shift+' '+x.start+'</button>').join('')+'</div>':'');type=v?.type||'clinic';dept=v?.dept||'';shiftName=v?.shift||'';start.value=v?.start||'08:30';end.value=v?.end||'16:30';note.value=v?.note||'';done.checked=!!v?.done;setType(type);shiftChoices.innerHTML=shifts.map(s=>'<button class="choice '+(s[0]===shiftName?'on':'')+'" data-n="'+s[0]+'" data-s="'+s[1]+'" data-e="'+s[2]+'">'+s[0]+' ('+s[1]+'–'+s[2]+')</button>').join('');shiftChoices.querySelectorAll('button').forEach(b=>b.onclick=()=>pickShift(b.dataset.n,b.dataset.s,b.dataset.e));updateCalc();if(!dlg.open)dlg.showModal()}
function pickShift(n,s,e){shiftName=n;start.value=s;end.value=e;[...shiftChoices.children].forEach(b=>b.classList.toggle('on',b.dataset.n===n));updateCalc()}function updateCalc(){calc.textContent=money(cost())}start.oninput=end.oninput=updateCalc;
function saveShift(){if(!dept)return alert('กรุณาเลือกหัวข้อเวร/สถานที่');if(!shiftName)shiftName='กำหนดเอง';let arr=data[selected]||(data[selected]=[]),v={id:editingId||Date.now(),type,dept,shift:shiftName,start:start.value,end:end.value,cost:cost(),note:note.value,done:done.checked};let i=arr.findIndex(x=>String(x.id)===String(editingId));if(i>=0)arr[i]=v;else arr.push(v);localStorage.setItem('shift-data',JSON.stringify(data));dlg.close();render()}function removeShift(){let arr=data[selected]||[],i=arr.findIndex(x=>String(x.id)===String(editingId));if(i>=0&&confirm('ลบเวรนี้?')){arr.splice(i,1);if(!arr.length)delete data[selected];localStorage.setItem('shift-data',JSON.stringify(data));dlg.close();render()}else if(editingId==null&&arr.length)alert('เลือกเวรด้านบนก่อน แล้วจึงกดลบ')}function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}function goToday(){view=new Date();render()}render();
</script><script>
function setTheme(t){document.body.dataset.theme=t;localStorage.setItem('shift-theme',t);document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('active',b.dataset.themeBtn===t));document.body.classList.remove('pop');void document.body.offsetWidth;document.body.classList.add('pop')}
function initTheme(){setTheme(localStorage.getItem('shift-theme')||'light')}
window.addEventListener('DOMContentLoaded',initTheme);
</script></body></html>

<!doctype html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ตารางเวร</title><style>
:root{--b:#603525;--bg:#fbf8f3;--line:#e6dccf;--ok:#16856d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans Thai',sans-serif;background:var(--bg);color:#35251e}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 12px #5c38200d}.big{font-size:25px;font-weight:800}.cal{margin-top:16px;overflow:hidden}.calhead{display:flex;justify-content:space-between;align-items:center;padding:4px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{background:var(--b);color:white;text-align:center;padding:10px;font-weight:700}.day{height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;cursor:pointer;position:relative}.day:hover{background:#fff8ef}.day.today{outline:3px solid #e8a04b;outline-offset:-3px;animation:pulse 1.5s infinite}.badge{font-size:11px;background:#fff0d8;border-radius:10px;padding:3px 6px;display:inline-block;margin-top:8px}.dot{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#e08a2e}.done{background:#dff4ec;color:var(--ok)}@keyframes pulse{50%{box-shadow:inset 0 0 0 5px #f5d4a555}}dialog{border:0;border-radius:22px;max-width:720px;width:94%;padding:0;box-shadow:0 20px 70px #0004}dialog::backdrop{background:#0006}.modal{padding:22px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:12px;cursor:pointer}.choice.on{background:var(--b);color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--b);color:white}.danger{background:#fee6e1;color:#a43c2e}.money{background:#f6eee5;border-radius:15px;padding:14px;font-weight:800;margin-top:14px}.nav button{background:white;border:1px solid var(--line)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.day{height:82px;padding:5px}.badge{font-size:9px}.row{grid-template-columns:1fr}.week div{font-size:11px;padding:8px 2px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class='wrap'><div class='top'><div><h1 style='margin-bottom:2px'>📅 ตารางเวรของฉัน</h1><div>เพิ่ม แก้ไข คำนวณค่าเวร และติดตามเวรที่ทำแล้ว</div></div><div class='nav'><button onclick='changeMonth(-1)'>‹</button> <button onclick='goToday()'>วันนี้</button> <button onclick='changeMonth(1)'>›</button></div></div><div class='stats' style='margin-top:16px'><div class='card'>เวรเดือนนี้<div class='big' id='count'>0 รายการ</div></div><div class='card'>รวมค่าเวร<div class='big' id='sum'>฿0</div></div><div class='card'>ได้รับแล้ว<div class='big' id='paid'>฿0</div></div><div class='card'>ความคืบหน้า<div class='big' id='progress'>0%</div></div></div><div class='panel cal'><div class='calhead'><h2 id='monthTitle'></h2><span>🟠 วันนี้ · 🔔 มีเวร · ✅ อยู่เวรแล้ว</span></div><div class='week'><div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div></div><div class='grid' id='grid'></div></div></div>
<dialog id='dlg'><div class='modal'><div style='display:flex;justify-content:space-between'><div><h2 style='margin:0'>บันทึกตารางเวร</h2><div id='dateLabel'></div></div><button onclick='dlg.close()'>✕</button></div><div class='field'><label>เลือกช่วงเวลาเวร</label><div class='choices' id='shiftChoices'></div></div><div class='field'><label>ประเภทค่าเวร</label><div class='choices'><button class='choice on' id='clinicBtn' onclick="setType('clinic')">🏥 คลินิก (90฿/ชม.)</button><button class='choice' id='hospitalBtn' onclick="setType('hospital')">🏨 รพ. (55฿/ชม.)</button></div></div><div class='field'><label>หัวข้อเวร / สถานที่</label><div class='choices' id='deptChoices'></div></div><div class='row'><div class='field'><label>เวลาเริ่ม</label><input type='time' id='start'></div><div class='field'><label>เวลาสิ้นสุด</label><input type='time' id='end'></div></div><div class='money'>💰 ค่าเวรคำนวณ: <span id='calc'>฿0</span></div><div class='field'><label>หมายเหตุ</label><textarea id='note' placeholder='เช่น สลับเวร, รับเคสพิเศษ'></textarea></div><label><input style='width:auto' type='checkbox' id='done'> อยู่เวรเรียบร้อยแล้ว / ได้รับค่าเวรแล้ว</label><div class='actions'><button class='danger' onclick='removeShift()'>ลบเวร</button><button onclick='dlg.close()'>ยกเลิก</button><button class='primary' onclick='saveShift()'>💾 บันทึก</button></div></div></dialog>
<script>
const shifts=[['เวรกลางวัน','08:30','16:30'],['รอบ 1','16:30','21:30'],['รอบ 2','21:30','02:30'],['รอบ 3','02:30','08:30']],clinic=['SPC','ENT','SM','PED','OP7','MS สั้น','MS ยาว','NM2 สั้น1','NM.2 สั้น2','NM.2 ยาว','103','SKN'],hospital=['103 1','103 2','103 3','IPD 1','IPD 2','IPD 3','IPD 4','IPD 5','NM.5 1','NM.5 2','NM.5 3'];let view=new Date(),selected='',type='clinic',dept='',shiftName='',data=JSON.parse(localStorage.getItem('shift-data')||'{}');const dlg=document.getElementById('dlg'),start=document.getElementById('start'),end=document.getElementById('end');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),money=n=>'฿'+Math.round(n).toLocaleString('th-TH');function hours(s,e){let[a,b]=s.split(':').map(Number),[c,d]=e.split(':').map(Number),x=c+d/60-a-b/60;return x<=0?x+24:x}const cost=()=>hours(start.value,end.value)*(type==='clinic'?90:55);
function render(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];monthTitle.textContent=months[m]+' '+(y+543);grid.innerHTML='';for(let i=0;i<first.getDay();i++)grid.insertAdjacentHTML('beforeend',"<div class='day'></div>");for(let d=1;d<=last.getDate();d++){let dt=new Date(y,m,d),k=key(dt),v=data[k],x=document.createElement('div');x.className='day'+(k===key(new Date())?' today':'');x.innerHTML='<b>'+d+'</b>'+(v?'<span class="dot"></span><br><span class="badge '+(v.done?'done':'')+'">'+(v.done?'✅ ':'🔔 ')+v.shift+' · '+v.dept+'</span>':'');x.onclick=()=>openDay(k);grid.append(x)}stats()}
function stats(){let pre=view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0'),a=Object.entries(data).filter(x=>x[0].startsWith(pre)).map(x=>x[1]),s=a.reduce((x,v)=>x+v.cost,0),p=a.filter(v=>v.done).reduce((x,v)=>x+v.cost,0);count.textContent=a.length+' รายการ';sum.textContent=money(s);paid.textContent=money(p);progress.textContent=(s?Math.round(p/s*100):0)+'%'}
function setType(t){type=t;clinicBtn.classList.toggle('on',t==='clinic');hospitalBtn.classList.toggle('on',t==='hospital');renderDept();updateCalc()}function renderDept(){deptChoices.innerHTML=(type==='clinic'?clinic:hospital).map(x=>'<button class="choice '+(x===dept?'on':'')+'" onclick="dept=this.textContent;renderDept()">'+x+'</button>').join('')}
function openDay(k){selected=k;let v=data[k];dateLabel.textContent=new Date(k+'T12:00').toLocaleDateString('th-TH',{dateStyle:'full'});type=v?.type||'clinic';dept=v?.dept||'';shiftName=v?.shift||'';start.value=v?.start||'08:30';end.value=v?.end||'16:30';note.value=v?.note||'';done.checked=!!v?.done;setType(type);shiftChoices.innerHTML=shifts.map(s=>'<button class="choice '+(s[0]===shiftName?'on':'')+'" data-n="'+s[0]+'" data-s="'+s[1]+'" data-e="'+s[2]+'">'+s[0]+' ('+s[1]+'–'+s[2]+')</button>').join('');shiftChoices.querySelectorAll('button').forEach(b=>b.onclick=()=>pickShift(b.dataset.n,b.dataset.s,b.dataset.e));updateCalc();dlg.showModal()}
function pickShift(n,s,e){shiftName=n;start.value=s;end.value=e;[...shiftChoices.children].forEach(b=>b.classList.toggle('on',b.dataset.n===n));updateCalc()}function updateCalc(){calc.textContent=money(cost())}start.oninput=end.oninput=updateCalc;
function saveShift(){if(!dept)return alert('กรุณาเลือกหัวข้อเวร/สถานที่');if(!shiftName)shiftName='กำหนดเอง';data[selected]={type,dept,shift:shiftName,start:start.value,end:end.value,cost:cost(),note:note.value,done:done.checked};localStorage.setItem('shift-data',JSON.stringify(data));dlg.close();render()}function removeShift(){if(data[selected]&&confirm('ลบเวรวันนี้?')){delete data[selected];localStorage.setItem('shift-data',JSON.stringify(data));dlg.close();render()}}function changeMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);render()}function goToday(){view=new Date();render()}render();
</script></body></html>
